name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # OIDC to cloud — no long-lived keys

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Aggregates changesets → version bumps + CHANGELOG, opens/updates the "Version Packages" PR,
      # or publishes when that PR merges.
      - name: Create Release PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Placeholder deploy steps — wire to the real target (K8s/PaaS) when infra lands.
      # - name: Build & push images (api, web, worker)  # infrastructure/docker
      # - name: prisma migrate deploy                    # gated, with backup checkpoint
      # - name: Deploy production (rolling/canary)
      # - name: Post-deploy smoke + health watch
