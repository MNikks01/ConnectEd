name: CodeQL

on:
  push:
    branches: [main, development]
  # Unfiltered for the same reason as ci.yml: a stacked PR must not silently skip security scanning.
  pull_request:
  schedule:
    - cron: '0 3 * * 1' # Mondays 03:00 UTC

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          language: ${{ matrix.language }}
          # One rule is excluded, with the reasoning written out beside it. In the repository
          # rather than dismissed in the UI, so it is reviewable and arguable.
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@v3
