name: CI

on:
  # Deliberately unfiltered by base branch. Restricting to [development, main] meant a PR stacked
  # on another feature branch ran *no* checks at all — and `gh pr checks` reports that as "no checks
  # reported", which reads like pending rather than absent. Sprint 0 merged one such PR believing it
  # was green.
  pull_request:
  push:
    branches: [development]

# Superseding a *pull request* run is right: only the latest push to a branch is worth checking,
# and the older run is answering a question nobody is asking any more.
#
# Superseding a **push to `development`** is not, and it cost this repository a red base. Two pull
# requests merged seventeen seconds apart on 2026-08-09; the second merge's run cancelled the
# first's, and a cancelled check reports as *absent* rather than as failed — so nothing anywhere
# said the branch had gone red, and the next release inherited a defect nobody had been told about.
#
# A post-merge run is not a check on a proposal, it is the record of whether a merge was good. It
# runs to completion even when another merge is already on its way.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default. CI only ever checks out and runs tests; a token that can also write to the
# repository is a token a compromised dependency can write to the repository with. Jobs that need
# more say so themselves — none here do.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: connected
          POSTGRES_PASSWORD: connected
          POSTGRES_DB: connected_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U connected"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://connected:connected@localhost:5432/connected_test?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Catches a migration that does not apply to a clean database — the failure mode that
      # otherwise surfaces during a release. `migrate deploy` is the non-dev command (never
      # `migrate dev`), per .docs/Database/02-migrations.md.
      - name: Apply migrations
        run: pnpm --filter @connected/api db:deploy

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm type-check

      # The API suite runs **with coverage**, which is what enforces NFR-009's thresholds
      # (`apps/api/vitest.config.ts`). Split rather than doubled: running `pnpm test` and then the
      # coverage run would execute the same 1150 tests twice for one number.
      - name: Test
        run: |
          pnpm turbo run test --filter='!@connected/api'
          pnpm --filter @connected/api test:coverage

      - name: Build
        run: pnpm build

  # Separate job: it needs a browser and boots both servers, so it is slower than `verify` and
  # should not delay that feedback. Runs against built output, not the dev server, because the dev
  # server papers over build-time failures.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: connected
          POSTGRES_PASSWORD: connected
          POSTGRES_DB: connected_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U connected"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://connected:connected@localhost:5432/connected_e2e?schema=public
      # Without this the suite runs against an unreachable queue and passes on the degraded path,
      # which would hide a broken fan-out the moment notification UI exists.
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: connected-e2e
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm --filter @connected/api db:deploy

      - name: Build
        run: pnpm build

      # A service container cannot express MinIO's `server /data` command, so it runs as a step.
      # Without it the API refuses to boot: S3 configuration is required, not optional.
      - name: Start object storage
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 2
          done

      # **Three engines, not one** (S9-17, NFR-011). The comment that stood here said "Chromium
      # only — the suite asserts behaviour, not rendering differences between engines", and it was
      # wrong in a way that cost nine sprints: the first WebKit run failed *every sign-in*, because
      # a `Secure` cookie over HTTP is kept by Chromium on localhost and dropped by WebKit. That is
      # behaviour, not rendering.
      #
      # Chromium still runs the whole suite; Firefox and WebKit run the specs where engines
      # genuinely differ — cookies, form submission, and a content security policy with a
      # per-response nonce. See `playwright.config.ts` for the split.
      - name: Install Playwright browsers
        run: pnpm --filter @connected/web exec playwright install --with-deps chromium firefox webkit

      - name: Run end-to-end tests
        run: pnpm --filter @connected/web test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # Alert rules and routing are configuration, and configuration that is only exercised in
  # production is configuration nobody trusts. A typo here used to mean a rule that silently never
  # fired; both binaries refuse a bad file, so CI catches it in seconds.
  observability-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Prometheus alert rules
        run: |
          docker run --rm -v "$PWD/infrastructure:/w:ro" --entrypoint promtool \
            prom/prometheus:v3.1.0 check rules /w/prometheus/alerts.yml

      - name: Check Alertmanager routing
        run: |
          docker run --rm -v "$PWD/infrastructure:/w:ro" --entrypoint amtool \
            prom/alertmanager:v0.28.0 check-config /w/alertmanager/alertmanager.yml

      - name: Every alert routes somewhere and names a runbook that exists
        run: node scripts/check-alerts.mjs

  # The restore drill (S9-7), kept honest.
  #
  # This does **not** prove the backups work — there is no database with real data in it yet, which
  # waits on S9-4. It proves the drill itself still runs: a restore script that has silently rotted
  # is worse than none, because it is the thing somebody reaches for on the worst morning of the
  # quarter and finds broken.
  #
  # Cheap, because the drill's own guard does the interesting part: it refuses an empty database,
  # so the seed has to have worked for this job to mean anything.
  restore-drill:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: connected
          POSTGRES_PASSWORD: connected
          POSTGRES_DB: connected_drill_src
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U connected"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://connected:connected@localhost:5432/connected_drill_src?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Migrate and seed
        run: |
          pnpm --filter @connected/api db:deploy
          pnpm --filter @connected/api db:seed

      # `--network host` because the service container is reachable at localhost from the job, and
      # the drill runs its client in a container of its own — see the script's header for why the
      # client is pinned to the server's image rather than taken from the runner.
      - name: Drill
        run: node scripts/restore-drill.mjs
        env:
          DRILL_URL: postgresql://connected:connected@localhost:5432/connected_drill_src
          DRILL_NETWORK: host
  # Secret scanning (S9-6).
  #
  # An image layer and a git object are both permanent: a secret committed and then removed is a
  # secret published, and the only useful moment to catch one is before the merge. This scans the
  # **whole history**, not the diff — 143 commits in under a second — because a secret that entered
  # three months ago is still live today, and a diff-only scan would say the branch is clean.
  #
  # `--no-git` is deliberately not used: it walks the working tree including `node_modules`, which
  # produced nineteen findings in other people's fixtures the one time it was tried.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Shallow by default, and a shallow clone is a scan of the last commit wearing the
          # costume of a scan of the repository.
          fetch-depth: 0

      - name: Scan the history for secrets
        run: |
          docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:latest \
            detect --source /repo --config /repo/.gitleaks.toml --no-banner --redact -v

  # The images the product will actually be deployed as (S9-1).
  #
  # Built on every pull request, and the point is not the artefact — nothing is pushed here, that is
  # the release's job. The point is that the Dockerfiles stay buildable. A monorepo image breaks
  # from an ordinary-looking change: a new workspace package that the manifest-copy step does not
  # list, a dependency that needs a compiler, a file that was only ever present on a laptop. Each of
  # those is silent until somebody deploys.
  #
  # Then scanned, because "minimal base, non-root, no dev dependencies" is a claim with a shelf
  # life: a base image that was clean when it was chosen acquires CVEs on somebody else's schedule.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the API and worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/api.Dockerfile
          load: true
          tags: connected-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/web.Dockerfile
          load: true
          tags: connected-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The claims the Dockerfiles make, checked rather than trusted. Each of these was true when
      # the file was written, and each is one careless `USER root` or one dev dependency away from
      # not being.
      - name: The images are what they claim to be
        run: |
          set -euo pipefail

          for image in connected-api:ci connected-web:ci; do
            user=$(docker image inspect "$image" --format '{{.Config.User}}')
            if [ "$user" != "node" ]; then
              echo "::error::$image runs as '${user:-root}', not node"
              exit 1
            fi
          done

          # tsx, vitest, Playwright and the Prisma CLI have no business in a running container.
          # The Prisma CLI is the interesting one: its absence is why the migrate target exists.
          for pkg in tsx vitest @playwright/test prisma typescript; do
            if docker run --rm --entrypoint sh connected-api:ci -c "[ -e node_modules/$pkg ]"; then
              echo "::error::connected-api ships the dev dependency $pkg"
              exit 1
            fi
          done

      - name: Scan both images
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: connected-api:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan the web image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: connected-web:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  changeset-check:
    runs-on: ubuntu-latest
    # Feature PRs into `development` must carry a changeset. A **release** PR into `main` is where
    # changesets are consumed — `changeset version` deletes every one of them — so this check can
    # only ever fail there, and failing it teaches people to ignore a red release.
    #
    # It passed on the first release by accident: one changeset named an ignored package, was
    # therefore never consumed, and left something for `status` to find. Removing that leftover
    # (#58) is what exposed this.
    #
    # The **back-merge** is the same case pointing the other way, and the `base_ref` test misses it:
    # it carries the release commit — a version bump and a CHANGELOG entry with every changeset
    # already deleted — into `development`, so `status` finds a changed package and nothing to
    # explain it. There is no changeset that could be added: writing one would publish the version
    # that just shipped a second time.
    #
    # This did not surface until 0.4.0 because the 0.3.0 back-merge passed vacuously — its merge
    # base *was* `development`'s tip, which already carried the bump, so no package file appeared in
    # the compared range at all. The case had never been tested.
    #
    # Keyed on the branch name, which `.docs/CI-CD/00-git-flow.md` requires a back-merge to use.
    if: >-
      github.event_name == 'pull_request'
      && github.base_ref != 'main'
      && !startsWith(github.head_ref, 'chore/back-merge')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Ensure a changeset exists for shippable changes
        run: pnpm changeset status --since=origin/${{ github.base_ref }}
