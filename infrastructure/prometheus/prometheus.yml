# Prometheus scrape configuration (local development).
#
# The API runs on the host via `pnpm dev`, not inside compose, so it is reached through
# `host.docker.internal`. Staging and production scrape the API's Kubernetes service instead and
# use their own copy of this file — see `.docs/Monitoring/00-observability.md`.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local

rule_files:
  - /etc/prometheus/alerts.yml

# Where a firing rule goes. Without this block the rules evaluate and stop — which is exactly what
# they did until S3-11.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: connected-api
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:4000']
        labels:
          service: connected-api
