# Alert rules derived from `.docs/Monitoring/01-slos-and-alerts.md`.
#
# Every alert carries a `runbook` annotation — the doc's rule is "no alert without an owner and a
# runbook". Thresholds here match the SLO table; the `for:` durations keep a brief blip from
# paging anyone.
#
# Every rule here is written against a metric the API actually exports. As of S5-10 that includes
# queue depth and lag, domain-event fan-out outcomes, and Postgres pool occupancy — the three
# groups at the bottom were impossible to write before those existed. A rule against a series that
# does not exist gives a permanently green board that means nothing, so they were absent rather
# than aspirational.
#
# Routing lives in `../alertmanager/alertmanager.yml`: `severity: page` reaches on-call, `ticket`
# goes to chat, and a page inhibits the tickets it would have caused for the same service.

groups:
  - name: availability
    rules:
      - alert: ApiDown
        expr: up{job="connected-api"} == 0
        for: 1m
        labels:
          severity: page
          service: connected-api
        annotations:
          summary: 'The API is not responding to scrapes.'
          description: 'Prometheus cannot reach {{ $labels.instance }}.'
          runbook: '.docs/Runbooks/api-outage.md'

      - alert: HighErrorRate
        # 5xx share of all requests. Matches the doc's "error rate > 5% for 5m" paging rule.
        expr: |
          sum(rate(http_request_duration_seconds_count{status=~"5.."}[5m]))
            /
          sum(rate(http_request_duration_seconds_count[5m]))
            > 0.05
        for: 5m
        labels:
          severity: page
          service: connected-api
        annotations:
          summary: 'More than 5% of requests are failing.'
          runbook: '.docs/Runbooks/api-outage.md'

      - alert: AvailabilitySloFastBurn
        # 2% of a 99.9%/30d budget burned in 1h — the doc's fast burn-rate page.
        expr: |
          sum(rate(http_request_duration_seconds_count{status=~"5.."}[1h]))
            /
          sum(rate(http_request_duration_seconds_count[1h]))
            > 0.0144
        for: 5m
        labels:
          severity: page
          service: connected-api
        annotations:
          summary: 'Burning the availability error budget fast.'
          description: 'At this rate the 30-day budget is exhausted well before the window ends.'
          runbook: '.docs/Runbooks/api-outage.md'

  - name: latency
    rules:
      - alert: ReadLatencyP95High
        # SLO: read p95 < 300ms.
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{method="GET"}[5m]))
          ) > 0.3
        for: 10m
        labels:
          severity: ticket
          service: connected-api
        annotations:
          summary: 'Read latency p95 is above the 300ms SLO.'
          runbook: '.docs/Runbooks/api-outage.md'

      - alert: WriteLatencyP95High
        # SLO: write p95 < 600ms.
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{method=~"POST|PATCH|PUT|DELETE"}[5m]))
          ) > 0.6
        for: 10m
        labels:
          severity: ticket
          service: connected-api
        annotations:
          summary: 'Write latency p95 is above the 600ms SLO.'
          runbook: '.docs/Runbooks/api-outage.md'

  - name: queue
    rules:
      - alert: QueueLagHigh
        # SLO: job queue processing lag p95 < 30s.
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(queue_job_wait_seconds_bucket[5m]))
          ) > 30
        for: 5m
        labels:
          severity: page
          service: connected-api
        annotations:
          summary: 'Jobs are waiting more than 30s to be picked up.'
          description: 'Notifications are running late; the worker may have stopped consuming.'
          runbook: '.docs/Runbooks/queue-backlog.md'

      - alert: QueueBacklogGrowing
        # Depth alone is not a problem — a burst is normal. Depth that keeps climbing is.
        expr: sum(queue_jobs{state="waiting"}) > 500 and deriv(sum(queue_jobs{state="waiting"})[15m:]) > 0
        for: 15m
        labels:
          severity: ticket
          service: connected-api
        annotations:
          summary: 'The event queue is deep and still growing.'
          runbook: '.docs/Runbooks/queue-backlog.md'

      - alert: DeadLetterQueueNotEmpty
        # BullMQ keeps jobs that exhausted every retry. They do not leave on their own.
        expr: sum(queue_jobs{state="failed"}) > 0
        for: 30m
        labels:
          severity: ticket
          service: connected-api
        annotations:
          summary: 'Jobs have exhausted their retries and are sitting in the dead-letter set.'
          description: 'Each one is a notification somebody never received.'
          runbook: '.docs/Runbooks/queue-backlog.md'

      - alert: EventFanoutFailureRate
        # SLO: notification delivery success >= 99.5%.
        expr: |
          sum(rate(domain_events_processed_total{result="failed"}[10m]))
            /
          clamp_min(sum(rate(domain_events_processed_total[10m])), 0.0001)
            > 0.005
        for: 10m
        labels:
          severity: ticket
          service: connected-api
        annotations:
          summary: 'More than 0.5% of domain events are failing their fan-out.'
          runbook: '.docs/Runbooks/queue-backlog.md'

      - alert: NotificationLatencyHigh
        # SLO: homework publish → notification, median < 10s.
        expr: |
          histogram_quantile(
            0.50,
            sum by (le) (rate(domain_event_latency_seconds_bucket[10m]))
          ) > 10
        for: 10m
        labels:
          severity: ticket
          service: connected-api
        annotations:
          summary: 'Half of all notifications are taking more than 10s to fan out.'
          runbook: '.docs/Runbooks/queue-backlog.md'

  - name: database
    rules:
      - alert: DbPoolExhausted
        # Requests queueing for a connection. From outside this is indistinguishable from a slow
        # database, which is why it is worth its own alert rather than being left to latency.
        expr: sum(db_pool_connections{state="waiting"}) > 0
        for: 5m
        labels:
          severity: page
          service: connected-api
        annotations:
          summary: 'Requests are queueing for a database connection.'
          description: 'The pool is fully checked out. Latency will look like a slow database.'
          runbook: '.docs/Runbooks/api-outage.md'

  - name: security
    rules:
      - alert: LoginFailureSpike
        # "login failure spike (possible attack)" from the business alerts.
        expr: |
          sum(rate(http_request_duration_seconds_count{route="/auth/login", status="401"}[5m])) > 1
        for: 10m
        labels:
          severity: ticket
          service: connected-api
        annotations:
          summary: 'Elevated login failures — possible credential stuffing.'
          runbook: '.docs/Runbooks/incident-response.md'
