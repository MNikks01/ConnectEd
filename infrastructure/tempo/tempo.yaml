# Tempo — distributed tracing store (ADR-0011).
#
# Local development only: single binary, local filesystem, no replication. Staging and production
# use object storage and retention policies of their own.
#
# The API exports OTLP/HTTP to :4318, which is what `OTEL_EXPORTER_OTLP_ENDPOINT` points at.

stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  # Short flush windows so a trace shows up in Grafana while you are still looking for it.
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 24h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Turns traces into RED metrics and writes them to Prometheus, so latency and error panels work
# per span without the service having to emit those metrics itself.
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  traces_storage:
    path: /var/tempo/generator/traces

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
